version: "2"
linters:
  enable:
    - bodyclose
    # - exhaustive
    # - goconst
    # - godot
    # - godox
    # - gomoddirectives
    - goprintffuncname
    # - gosec
    - misspell
    # - nakedret
    # - nestif
    # - nilerr
    - noctx
    - nolintlint
    # - prealloc
    # - revive
    - rowserrcheck
    - sqlclosecheck
    - staticcheck
    - tparallel
    # - unconvert
    # - unparam
    - whitespace
    # - wrapcheck
  disable:
    - errcheck
    - ineffassign
    - unused
  exclusions:
    generated: lax
    presets:
      - common-false-positives
    # internal/deps is vendored third-party code, kept as close to upstream as
    # possible so it can be re-synced. Linting it produces findings nobody here
    # is allowed to act on.
    paths:
      - internal/deps
    rules:
      - text: '(slog|log)\.\w+'
        linters:
          - noctx
      - path: internal/shell/run.go
        text: "SA1019.*interp.ExecHandler"
        linters:
          - staticcheck
      - path: internal/agent/tools/mcp/init.go
        text: "SA1019.*LoggingMessageHandler"
        linters:
          - staticcheck
      # The clipboard test builds a Win32 DROPFILES blob by hand inside a
      # GlobalAlloc'd block. The pointer arithmetic is the shape the API
      # requires; govet cannot tell it apart from a real misuse.
      - path: internal/clipboard/files_windows_test.go
        text: "unsafeptr"
        linters:
          - govet
      # SA4023 false positive: RemoveConfigField returns non-nil errors.
      - path: internal/cmd/logout.go
        text: "SA4023"
        linters:
          - staticcheck
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
formatters:
  enable:
    - gofumpt
    # - goimports
  exclusions:
    generated: lax
    paths:
      - internal/deps
