name: Release NPM

# Triggered by the Release workflow completing successfully. Publishes the
# wrapper package @atlas-coder/atlas-agent to npmjs with the version that
# matches the release tag.
#
# Setup required:
#   - secrets.NPM_TOKEN must be set in repo settings (publish automation token
#     with bypass-2fa enabled; classic or granular with "Publish packages").

on:
  workflow_run:
    workflows: ["Release"]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to publish (e.g. v0.2.1). Defaults to latest published release.'
        required: false
        type: string

permissions:
  contents: read

jobs:
  publish:
    name: Publish @atlas-coder/atlas-agent
    runs-on: ubuntu-latest
    # When triggered by workflow_run, only publish on success. When triggered
    # manually we skip the gate — the operator picked the tag on purpose.
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Resolve release version
        id: version
        run: |
          set -euo pipefail
          if [ -n "${{ inputs.tag }}" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG=$(curl -fsSL \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${{ github.repository }}/releases/latest" \
              | jq -r .tag_name)
          fi
          if [ -z "$TAG" ] || [ "$TAG" = "null" ]; then
            echo "::error::No release tag found"
            exit 1
          fi
          VERSION="${TAG#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Resolved version $VERSION from tag $TAG"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Sync package.json version
        working-directory: npm/cli
        # Always bump patch (0.2.1 -> 0.2.2 -> 0.2.3 ...) so we never collide
        # with the version that's already on the registry. `--no-git-tag-version`
        # keeps this purely local; the release tag lives in git, not npm.
        # We do NOT use `set -e` because `npm version patch` is non-zero
        # when the version field is already what was asked for, and
        # earlier iterations of this workflow tripped over that edge case.
        run: |
          echo "Current local version: $(node -p "require('./package.json').version")"
          echo "Release tag version:   $VERSION"
          echo "Running: npm version patch --no-git-tag-version --allow-same-version"
          npm version patch --no-git-tag-version --allow-same-version
          echo "Final package.json version: $(node -p "require('./package.json').version")"

      - name: Verify package contents
        working-directory: npm/cli
        run: |
          echo "--- npm pack --dry-run ---"
          npm pack --dry-run
          echo "--- package.json ---"
          cat package.json

      - name: Publish to npmjs
        working-directory: npm/cli
        # No --provenance: the publish automation token can't mint an OIDC
        # attestation, so passing --provenance=true (or =false in some npm
        # 11 builds) makes the publish fail with E401. Default provenance
        # handling is fine.
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
