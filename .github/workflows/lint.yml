name: lint

# Self-contained. This used to call charmbracelet/meta's reusable lint
# workflow, which this repository has no claim on: GitHub could not resolve
# it, so every run ended in startup_failure before a single linter ran.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: lint-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  golangci:
    name: golangci-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v6
        with:
          version: v2.13.1
          args: --config=.golangci.yml --timeout=10m
